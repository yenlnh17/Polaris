        <style>
            .article-page {
                padding-top: var(--navbar-height);
            }

            /* Article hero */
            .article-hero {
                position: relative;
                height: clamp(300px, 50vw, 520px);
                overflow: hidden;
            }
            .article-hero img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .article-hero__overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(33, 6, 53, 0.7) 0%,
                    transparent 50%
                );
            }

            /* Article layout */
            .article-layout {
                display: grid;
                grid-template-columns: 1fr;
                gap: var(--space-10);
            }
            @media (min-width: 1024px) {
                .article-layout {
                    grid-template-columns: 1fr 280px;
                }
            }

            /* Article body typography */
            .article-body h2 {
                font-family: var(--font-display);
                font-size: var(--text-3xl);
                margin: var(--space-8) 0 var(--space-4);
                color: var(--text-primary);
            }
            .article-body h3 {
                font-size: var(--text-xl);
                font-weight: 700;
                margin: var(--space-6) 0 var(--space-3);
                color: var(--text-primary);
            }
            .article-body p {
                font-size: var(--text-base);
                line-height: 1.85;
                color: var(--text-secondary);
                margin-bottom: var(--space-5);
            }
            .article-body ul,
            .article-body ol {
                margin: 0 0 var(--space-5) var(--space-6);
            }
            .article-body li {
                font-size: var(--text-base);
                line-height: 1.7;
                color: var(--text-secondary);
                margin-bottom: var(--space-2);
            }
            .article-body blockquote {
                border-left: 4px solid var(--color-primary);
                padding-left: var(--space-5);
                margin: var(--space-6) 0;
                font-style: italic;
                color: var(--text-muted);
            }
            .article-body img {
                border-radius: var(--radius-xl);
                width: 100%;
                margin: var(--space-6) 0;
            }

            /* TOC */
            .toc {
                background: var(--bg-alt);
                border-radius: var(--radius-xl);
                padding: var(--space-5);
                border: 1px solid var(--border-color);
            }
            .toc__title {
                font-weight: 700;
                font-size: var(--text-sm);
                margin-bottom: var(--space-3);
                color: var(--text-primary);
            }
            .toc__link {
                display: block;
                font-size: var(--text-sm);
                color: var(--text-muted);
                padding: var(--space-1) 0;
                border-left: 2px solid transparent;
                padding-left: var(--space-3);
                transition: all var(--transition-fast);
            }
            .toc__link:hover,
            .toc__link.is-active {
                color: var(--color-primary);
                border-left-color: var(--color-primary);
            }

            /* Share */
            .share-bar {
                display: flex;
                gap: var(--space-3);
                flex-wrap: wrap;
                margin-top: var(--space-6);
                padding-top: var(--space-6);
                border-top: 1px solid var(--border-color);
            }

            /* Related */
            .related-card {
                text-decoration: none;
                display: flex;
                gap: var(--space-4);
                padding: var(--space-4);
                border-radius: var(--radius-xl);
                border: 1px solid var(--border-color);
                transition: border-color var(--transition-fast);
            }
            .related-card:hover {
                border-color: var(--color-secondary);
            }
            .related-card__img {
                width: 80px;
                height: 80px;
                border-radius: var(--radius-lg);
                object-fit: cover;
                flex-shrink: 0;
            }
        </style>
    </head>
    <body class="article-page">
        <!-- NAVBAR -->
        <header class="navbar navbar--solid">
            <div class="navbar__inner">
                <a href="index.html" class="navbar__brand">
                    <img
                        src="assets/images/logo.png"
                        alt="Polaris logo"
                        class="navbar__logo"
                    />
                    <span class="navbar__name">POLARIS</span>
                </a>
                <nav class="navbar__links" aria-label="Main navigation">
                    <a
                        href="index.html"
                        class="navbar__link"
                        data-nav-page="index.html"
                        data-i18n="nav.home"
                        >Trang chủ</a
                    >
                    <a
                        href="destinations.html"
                        class="navbar__link"
                        data-nav-page="destinations.html"
                        data-i18n="nav.destinations"
                        >Điểm đến</a
                    >
                    <a
                        href="planner.html"
                        class="navbar__link"
                        data-nav-page="planner.html"
                        data-i18n="nav.planner"
                        >Lập kế hoạch</a
                    >
                    <a
                        href="packages.html"
                        class="navbar__link"
                        data-nav-page="packages.html"
                        data-i18n="nav.packages"
                        >Gói dịch vụ</a
                    >
                    <a
                        href="blog.html"
                        class="navbar__link"
                        data-nav-page="blog.html"
                        data-i18n="nav.blog"
                        >Cẩm nang</a
                    >
                    <a
                        href="about.html"
                        class="navbar__link navbar__link--active"
                        data-nav-page="about.html"
                        data-i18n="nav.about"
                        >Về chúng tôi</a
                    >
                    <a
                        href="contact.html"
                        class="navbar__link"
                        data-nav-page="contact.html"
                        data-i18n="nav.contact"
                        >Liên hệ</a
                    >
                </nav>
                <div class="navbar__actions">
                    <div
                        class="lang-toggle"
                        role="group"
                        aria-label="Chọn ngôn ngữ"
                    >
                        <button
                            class="lang-toggle__btn lang-toggle__btn--active"
                            data-lang="vi"
                        >
                            VI
                        </button>
                        <button class="lang-toggle__btn" data-lang="en">
                            EN
                        </button>
                    </div>
                    <a
                        href="planner.html"
                        class="navbar__cta btn btn--primary btn--sm"
                        data-i18n="nav.cta"
                        >Lập hành trình</a
                    >
                    <button
                        class="navbar__hamburger"
                        aria-expanded="false"
                        aria-controls="mobile-menu-article"
                        aria-label="Mở menu"
                    >
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
            <nav
                id="mobile-menu-article"
                class="navbar__mobile"
                aria-label="Mobile navigation"
            >
                <a
                    href="index.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.home"
                    >Trang chủ</a
                >
                <a
                    href="destinations.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.destinations"
                    >Điểm đến</a
                >
                <a
                    href="planner.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.planner"
                    >Lập kế hoạch</a
                >
                <a
                    href="packages.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.packages"
                    >Gói dịch vụ</a
                >
                <a
                    href="blog.html"
                    class="navbar__mobile-link navbar__mobile-link--active"
                    data-i18n="nav.blog"
                    >Cẩm nang</a
                >
                <a
                    href="about.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.about"
                    >Về chúng tôi</a
                >
                <a
                    href="contact.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.contact"
                    >Liên hệ</a
                >
                <div class="navbar__mobile-actions">
                    <div class="lang-toggle" role="group">
                        <button
                            class="lang-toggle__btn lang-toggle__btn--active"
                            data-lang="vi"
                        >
                            VI
                        </button>
                        <button class="lang-toggle__btn" data-lang="en">
                            EN
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main">
            <!-- Loading -->
            <div
                id="article-loading"
                style="text-align: center; padding: var(--space-20)"
            >
                <div
                    class="skeleton"
                    style="
                        width: 100%;
                        height: 400px;
                        margin-bottom: var(--space-8);
                    "
                ></div>
                <div
                    class="skeleton"
                    style="
                        width: 60%;
                        height: 32px;
                        margin: 0 auto var(--space-4);
                    "
                ></div>
                <div
                    class="skeleton"
                    style="
                        width: 80%;
                        height: 16px;
                        margin: 0 auto var(--space-3);
                    "
                ></div>
                <div
                    class="skeleton"
                    style="width: 80%; height: 16px; margin: 0 auto"
                ></div>
            </div>

            <!-- Content injected by blog.js -->
            <div id="article-content" class="hidden"></div>
        </main>

        <!-- FOOTER -->
        <footer class="footer">

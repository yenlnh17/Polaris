<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chi Tiết Điểm Đến – Polaris</title>
        <meta
            name="description"
            content="Khám phá chi tiết điểm đến, gallery ảnh, highlight và đặt phòng qua đối tác."
        />
        <link rel="canonical" href="destination.html" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components/navbar.css" />
        <link rel="stylesheet" href="css/components/footer.css" />
        <link rel="stylesheet" href="css/components/cards.css" />
        <link rel="stylesheet" href="css/components/buttons.css" />
        <link rel="stylesheet" href="css/components/forms.css" />
        <link rel="stylesheet" href="css/components/modal.css" />
        <link rel="stylesheet" href="css/components/toast.css" />

        <style>
            /* Gallery hero */
            .gallery-hero {
                position: relative;
                height: 70vh;
                min-height: 420px;
                overflow: hidden;
            }
            .gallery-hero__main {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .gallery-hero__overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(33, 6, 53, 0.7) 0%,
                    transparent 50%
                );
            }
            .gallery-hero__info {
                position: absolute;
                bottom: var(--space-8);
                left: 0;
                right: 0;
            }
            .gallery-hero__info .container {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: var(--space-4);
            }
            .gallery-hero__title {
                font-family: var(--font-display);
                font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl));
                color: white;
            }
            .gallery-hero__region {
                font-size: var(--text-sm);
                color: var(--color-lightest);
                font-weight: 600;
                margin-bottom: var(--space-2);
            }
            .gallery-hero__meta {
                display: flex;
                align-items: center;
                gap: var(--space-4);
                flex-wrap: wrap;
            }
            .gallery-hero__actions {
                display: flex;
                gap: var(--space-3);
            }

            /* Thumbnails */
            .gallery-thumbs {
                display: flex;
                gap: var(--space-2);
                padding: var(--space-3) 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .gallery-thumbs::-webkit-scrollbar {
                display: none;
            }
            .gallery-thumb {
                width: 80px;
                height: 60px;
                border-radius: var(--radius-md);
                overflow: hidden;
                border: 2px solid transparent;
                cursor: pointer;
                flex-shrink: 0;
                transition: border-color var(--transition-fast);
            }
            .gallery-thumb.is-active,
            .gallery-thumb:hover {
                border-color: var(--color-primary);
            }
            .gallery-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Content tabs */
            .detail-tabs {
                border-bottom: 2px solid var(--border-color);
                display: flex;
                gap: 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .detail-tabs::-webkit-scrollbar {
                display: none;
            }
            .detail-tab {
                padding: var(--space-4) var(--space-5);
                font-weight: 600;
                font-size: var(--text-sm);
                color: var(--text-muted);
                white-space: nowrap;
                border-bottom: 2px solid transparent;
                margin-bottom: -2px;
                cursor: pointer;
                transition:
                    color var(--transition-fast),
                    border-color var(--transition-fast);
            }
            .detail-tab.is-active {
                color: var(--color-primary);
                border-bottom-color: var(--color-primary);
            }
            .detail-tab:hover:not(.is-active) {
                color: var(--color-secondary);
            }
            .detail-panel {
                display: none;
                padding: var(--space-6) 0;
            }
            .detail-panel.is-active {
                display: block;
            }
            /* Sidebar booking */
            .booking-sidebar {
                background: white;
                border-radius: var(--radius-xl);
                border: 1px solid var(--border-color);
                box-shadow: var(--shadow-card);
                padding: var(--space-6);
            }
            .booking-sidebar__title {
                font-family: var(--font-display);
                font-size: var(--text-xl);
                margin-bottom: var(--space-4);
                color: var(--text-primary);
            }
            .partner-btn {
                display: flex;
                align-items: center;
                gap: var(--space-3);
                padding: var(--space-3) var(--space-4);
                border: 1.5px solid var(--border-color);
                border-radius: var(--radius-lg);
                color: var(--text-primary);
                font-size: var(--text-sm);
                font-weight: 600;
                transition: all var(--transition-fast);
                margin-bottom: var(--space-3);
            }
            .partner-btn:hover {
                border-color: var(--color-secondary);
                background: rgba(102, 103, 171, 0.04);
                color: var(--color-primary);
            }
            .partner-btn__icon {
                font-size: 1.25rem;
            }

            /* Month badges */
            .month-grid {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-2);
            }
            .month-badge {
                padding: var(--space-1) var(--space-3);
                border-radius: var(--radius-full);
                font-size: var(--text-xs);
                font-weight: 600;
                background: var(--bg-alt);
                color: var(--text-muted);
            }
            .month-badge--best {
                background: rgba(66, 13, 75, 0.1);
                color: var(--color-primary);
            }

            /* Related row */
            .related-card {
                width: 220px;
                flex-shrink: 0;
            }
        </style>
    </head>
    <body style="padding-top: var(--navbar-height)">
        <!-- NAVBAR -->
        <header class="navbar navbar--solid">
            <div class="navbar__inner">
                <a href="index.html" class="navbar__brand">
                    <img
                        src="assets/images/logo.jpg"
                        alt="Polaris logo"
                        class="navbar__logo"
                    />
                    <span class="navbar__name">POLARIS</span>
                </a>
                <nav class="navbar__links" aria-label="Main navigation">
                    <a
                        href="index.html"
                        class="navbar__link"
                        data-nav-page="index.html"
                        data-i18n="nav.home"
                        >Trang chủ</a
                    >
                    <a
                        href="destinations.html"
                        class="navbar__link"
                        data-nav-page="destinations.html"
                        data-i18n="nav.destinations"
                        >Điểm đến</a
                    >
                    <a
                        href="planner.html"
                        class="navbar__link"
                        data-nav-page="planner.html"
                        data-i18n="nav.planner"
                        >Lập kế hoạch</a
                    >
                    <a
                        href="packages.html"
                        class="navbar__link"
                        data-nav-page="packages.html"
                        data-i18n="nav.packages"
                        >Gói dịch vụ</a
                    >
                    <a
                        href="blog.html"
                        class="navbar__link"
                        data-nav-page="blog.html"
                        data-i18n="nav.blog"
                        >Cẩm nang</a
                    >
                </nav>
                <div class="navbar__actions">
                    <div
                        class="lang-toggle"
                        role="group"
                        aria-label="Chọn ngôn ngữ"
                    >
                        <button
                            class="lang-toggle__btn lang-toggle__btn--active"
                            data-lang="vi"
                        >
                            VI
                        </button>
                        <button class="lang-toggle__btn" data-lang="en">
                            EN
                        </button>
                    </div>
                    <a
                        href="planner.html"
                        class="navbar__cta btn btn--primary btn--sm"
                        data-i18n="nav.cta"
                        >Lập hành trình</a
                    >
                    <button
                        class="navbar__hamburger"
                        aria-expanded="false"
                        aria-controls="mobile-menu-detail"
                        aria-label="Mở menu"
                    >
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
            <nav
                id="mobile-menu-detail"
                class="navbar__mobile"
                aria-label="Mobile navigation"
            >
                <a
                    href="index.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.home"
                    >Trang chủ</a
                >
                <a
                    href="destinations.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.destinations"
                    >Điểm đến</a
                >
                <a
                    href="planner.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.planner"
                    >Lập kế hoạch</a
                >
                <a
                    href="packages.html"
                    class="navbar__mobile-link"
                    data-i18n="nav.packages"
                    >Gói dịch vụ</a
                >
                <div class="navbar__mobile-actions">
                    <div class="lang-toggle" role="group">
                        <button
                            class="lang-toggle__btn lang-toggle__btn--active"
                            data-lang="vi"
                        >
                            VI
                        </button>
                        <button class="lang-toggle__btn" data-lang="en">
                            EN
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main">
            <!-- Loading state -->
            <div
                id="dest-loading"
                style="text-align: center; padding: var(--space-20)"
            >
                <div
                    class="skeleton"
                    style="
                        width: 200px;
                        height: 24px;
                        margin: 0 auto var(--space-4);
                    "
                ></div>
                <div
                    class="skeleton"
                    style="
                        width: 100%;
                        max-width: 800px;
                        height: 400px;
                        margin: 0 auto;
                        border-radius: var(--radius-xl);
                    "
                ></div>
            </div>

            <!-- Content injected by destination.js -->
            <div id="dest-content" class="hidden"></div>
        </main>

        <!-- FAB: Add to itinerary (mobile) -->
        <a
            href="#"
            class="fab hidden"
            id="fab-planner"
            data-i18n="detail.add_itinerary"
        >
            ✨ Thêm vào hành trình
        </a>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="container">
                <div class="footer__bottom">
                    <p class="footer__copyright" data-i18n="footer.copyright">
                        © 2026 Polaris. Bản quyền thuộc về Polaris Travel.
                    </p>
                </div>
            </div>
        </footer>

        <script type="module" src="js/pages/destination.js"></script>
    </body>
</html>

        <style>
            /* Gallery hero */
            .gallery-hero {
                position: relative;
                height: 70vh;
                min-height: 420px;
                overflow: hidden;
            }
            .gallery-hero__main {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .gallery-hero__overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(33, 6, 53, 0.7) 0%,
                    transparent 50%
                );
            }
            .gallery-hero__info {
                position: absolute;
                bottom: var(--space-8);
                left: 0;
                right: 0;
            }
            .gallery-hero__info .container {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: var(--space-4);
            }
            .gallery-hero__title {
                font-family: var(--font-display);
                font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl));
                color: white;
            }
            .gallery-hero__region {
                font-size: var(--text-sm);
                color: var(--color-lightest);
                font-weight: 600;
                margin-bottom: var(--space-2);
            }
            .gallery-hero__meta {
                display: flex;
                align-items: center;
                gap: var(--space-4);
                flex-wrap: wrap;
            }
            .gallery-hero__actions {
                display: flex;
                gap: var(--space-3);
            }

            /* Thumbnails */
            .gallery-thumbs {
                display: flex;
                gap: var(--space-2);
                padding: var(--space-3) 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .gallery-thumbs::-webkit-scrollbar {
                display: none;
            }
            .gallery-thumb {
                width: 80px;
                height: 60px;
                border-radius: var(--radius-md);
                overflow: hidden;
                border: 2px solid transparent;
                cursor: pointer;
                flex-shrink: 0;
                transition: border-color var(--transition-fast);
            }
            .gallery-thumb.is-active,
            .gallery-thumb:hover {
                border-color: var(--color-primary);
            }
            .gallery-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Content tabs */
            .detail-tabs {
                border-bottom: 2px solid var(--border-color);
                display: flex;
                gap: 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .detail-tabs::-webkit-scrollbar {
                display: none;
            }
            .detail-tab {
                padding: var(--space-4) var(--space-5);
                font-weight: 600;
                font-size: var(--text-sm);
                color: var(--text-muted);
                white-space: nowrap;
                border-bottom: 2px solid transparent;
                margin-bottom: -2px;
                cursor: pointer;
                transition:
                    color var(--transition-fast),
                    border-color var(--transition-fast);
            }
            .detail-tab.is-active {
                color: var(--color-primary);
                border-bottom-color: var(--color-primary);
            }
            .detail-tab:hover:not(.is-active) {
                color: var(--color-secondary);
            }
            .detail-panel {
                display: none;
                padding: var(--space-6) 0;
            }
            .detail-panel.is-active {
                display: block;
            }
            /* Sidebar booking */
            .booking-sidebar {
                background: white;
                border-radius: var(--radius-xl);
                border: 1px solid var(--border-color);
                box-shadow: var(--shadow-card);
                padding: var(--space-6);
            }
            .booking-sidebar__title {
                font-family: var(--font-display);
                font-size: var(--text-xl);
                margin-bottom: var(--space-4);
                color: var(--text-primary);
            }
            .partner-btn {
                display: flex;
                align-items: center;
                gap: var(--space-3);
                padding: var(--space-3) var(--space-4);
                border: 1.5px solid var(--border-color);
                border-radius: var(--radius-lg);
                color: var(--text-primary);
                font-size: var(--text-sm);
                font-weight: 600;
                transition: all var(--transition-fast);
                margin-bottom: var(--space-3);
            }
            .partner-btn:hover {
                border-color: var(--color-secondary);
                background: rgba(102, 103, 171, 0.04);
                color: var(--color-primary);
            }
            .partner-btn__icon {
                font-size: 1.25rem;
            }

            /* Month badges */
            .month-grid {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-2);
            }
            .month-badge {
                padding: var(--space-1) var(--space-3);
                border-radius: var(--radius-full);
                font-size: var(--text-xs);
                font-weight: 600;
                background: var(--bg-alt);
                color: var(--text-muted);
            }
            .month-badge--best {
                background: rgba(66, 13, 75, 0.1);
                color: var(--color-primary);
            }

            /* Related row */
            .related-card {
                width: 220px;
                flex-shrink: 0;
            }

            /* FAB — mobile floating action button */
            .fab {
                width: fit-content;
                position: fixed;
                bottom: var(--space-6);
                left: 50%;
                transform: translateX(-50%);
                background: var(--gradient-cta);
                color: white;
                padding: var(--space-3) var(--space-8);
                border-radius: var(--radius-full);
                font-weight: 600;
                font-size: var(--text-sm);
                box-shadow: var(--shadow-lg);
                z-index: 90;
                white-space: nowrap;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: var(--space-2);
                transition:
                    transform var(--transition-fast),
                    box-shadow var(--transition-fast);
            }
            .fab:hover {
                transform: translateX(-50%) translateY(-2px);
                box-shadow: 0 8px 24px rgba(66, 13, 75, 0.35);
            }
            @media (min-width: 1024px) {
                .fab {
                    display: none;
                }
            }

            /* Gallery hero — mobile */
            @media (max-width: 639px) {
                .gallery-hero {
                    height: 55vh;
                    min-height: 300px;
                }
                /* Stronger gradient so white text is legible on any photo */
                .gallery-hero__overlay {
                    background: linear-gradient(
                        to top,
                        rgba(33, 6, 53, 0.9) 0%,
                        rgba(33, 6, 53, 0.55) 35%,
                        rgba(33, 6, 53, 0.1) 60%,
                        transparent 75%
                    );
                }
                .gallery-hero__info {
                    bottom: var(--space-5);
                }
                .gallery-hero__info .container {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: var(--space-2);
                }
                .gallery-hero__title {
                    font-size: clamp(var(--text-2xl), 7vw, var(--text-4xl));
                    line-height: 1.15;
                }
                .gallery-hero__region {
                    margin-bottom: var(--space-1);
                    font-size: var(--text-xs);
                }
                .gallery-hero__meta {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: var(--space-1);
                }
                .gallery-hero__actions {
                    align-self: flex-start;
                    gap: var(--space-2);
                }
                /* Smaller thumbnail strip on mobile */
                .gallery-thumb {
                    width: 64px;
                    height: 48px;
                }
                /* Tighter tab padding on mobile so all 4 tabs are visible */
                .detail-tab {
                    padding: var(--space-3) var(--space-3);
                    font-size: var(--text-xs);
                }
            }

            /* Tablet hero (640–1023px): row layout, tighter fonts */
            @media (min-width: 640px) and (max-width: 1023px) {
                .fab span {
                    font-size: var(--text-2xl);
                }
                .gallery-hero {
                    height: 60vh;
                    min-height: 360px;
                }
                .gallery-hero__info {
                    bottom: var(--space-6);
                }
                .gallery-hero__title {
                    font-size: clamp(var(--text-3xl), 4vw, var(--text-4xl));
                }
            }

            /* Booking sidebar + aside — hide on mobile (FAB handles CTA) */
            @media (max-width: 1023px) {
                .booking-sidebar {
                    display: none;
                }
                /* Hide the empty aside grid item to remove phantom gap */
                .layout--sidebar-right .sidebar {
                    display: none;
                }
                .layout--sidebar-right {
                    gap: 0;
                }
                /* Footer: push content above FAB */
                .footer {
                    padding-bottom: 80px;
                }
                /* Prevent horizontal scroll without clipping fixed elements */
                body {
                    overflow-x: clip;
                }
            }
        </style>
